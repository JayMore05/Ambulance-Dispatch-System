<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastRescue - Admin Dashboard</title>
  <style>
    :root { 
        --bg: #f8fafc; 
        --card: #ffffff; 
        --border: #e2e8f0; 
        --primary: #3b82f6; 
        --success: #10b981; 
        --warning: #f59e0b; 
        --danger: #ef4444; 
        --text: #1e293b; 
        --muted: #64748b; 
    }
    
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 20px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid var(--border); }
    .brand { font-weight: 800; font-size: 1.5rem; color: var(--primary); letter-spacing: -0.5px; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { background: #f1f5f9; font-weight: 700; color: var(--muted); text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
    tr:hover { background: #f8fafc; }
    
    .badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; display: inline-block; }
    .badge.pending { background: #fef3c7; color: #b45309; }
    .badge.approved { background: #dcfce7; color: #166534; }
    .badge.rejected { background: #fee2e2; color: #991b1b; }
    .badge.deleted { background: #334155; color: #ffffff; }
    
    .doc-link { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 13px; display: block; margin-bottom: 4px; }
    .doc-link:hover { text-decoration: underline; }
    
    .btn { padding: 8px 12px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-right: 6px; }
    .btn:active { transform: scale(0.95); }
    .btn.success { background: var(--success); color: white; }
    .btn.danger { background: var(--danger); color: white; }
    .btn.ghost { background: #e2e8f0; color: var(--text); }
  </style>
</head>
<body>

<div class="header">
  <div class="brand">🚑 FastRescue Control Center</div>
  <button class="btn ghost" onclick="loadDrivers()">🔄 Refresh Data</button>
</div>

<div class="card">
  <h2 style="margin-top: 0;">Driver Queue & Management</h2>
  <p style="color: var(--muted); font-size: 14px; margin-bottom: 20px;">Review documents, approve drivers, or process account deletion requests.</p>
  
  <div style="overflow-x: auto;">
    <table>
      <thead>
        <tr>
          <th>Driver Info</th>
          <th>Vehicle</th>
          <th>KYC Documents (Click to View)</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="driverTableBody">
        <tr><td colspan="5" style="text-align: center; color: var(--muted);">Loading drivers...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // Change this to your Render URL!
  const BASE_URL = "https://ambulance-dispatch-system.onrender.com";

  window.onload = loadDrivers;

  async function loadDrivers() {
    const tbody = document.getElementById('driverTableBody');
    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--muted);">Fetching data from server...</td></tr>';
    
    try {
      const res = await fetch(`${BASE_URL}/api/admin/drivers`);
      const data = await res.json();
      
      if (!data.drivers || data.drivers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; font-weight: bold;">No drivers found.</td></tr>';
        return;
      }

      tbody.innerHTML = "";
      data.drivers.forEach(d => {
        let badgeClass = 'pending';
        if (d.verification_status === 'APPROVED') badgeClass = 'approved';
        if (d.verification_status === 'REJECTED') badgeClass = 'rejected';
        if (d.verification_status === 'DELETED') badgeClass = 'deleted';
        if (d.verification_status === 'DELETION_REQUESTED') badgeClass = 'danger';

        const aadharLink = d.aadhar_url ? `<a href="${d.aadhar_url}" target="_blank" class="doc-link">📄 Aadhar</a>` : `<span style="color:var(--muted); font-size:12px;">No ID</span><br>`;
        const rcLink = d.rc_url ? `<a href="${d.rc_url}" target="_blank" class="doc-link">📄 RC Book</a>` : `<span style="color:var(--muted); font-size:12px;">No RC</span><br>`;
        const insLink = d.insurance_url ? `<a href="${d.insurance_url}" target="_blank" class="doc-link">📄 Insurance</a>` : `<span style="color:var(--muted); font-size:12px;">No Ins</span><br>`;
        const pucLink = d.puc_url ? `<a href="${d.puc_url}" target="_blank" class="doc-link">📄 PUC</a>` : `<span style="color:var(--muted); font-size:12px;">No PUC</span><br>`;

        let actionButtons = "";
        
        // Only show Approval/Rejection if they aren't deleted or requesting deletion
        if (d.verification_status !== 'APPROVED' && d.verification_status !== 'DELETED' && d.verification_status !== 'DELETION_REQUESTED') {
            actionButtons += `<button class="btn success" onclick="updateStatus(${d.driver_id}, 'APPROVED')">Approve</button>`;
        }
        if (d.verification_status !== 'REJECTED' && d.verification_status !== 'DELETED' && d.verification_status !== 'DELETION_REQUESTED') {
            actionButtons += `<button class="btn danger" onclick="rejectDriver(${d.driver_id}, '${d.name}')">Reject</button>`;
        }
        
        // Show Deletion Approval if requested
        if (d.verification_status === 'DELETION_REQUESTED') {
            actionButtons += `<button class="btn danger" onclick="approveDeletion(${d.driver_id}, '${d.name}')">⚠️ Approve Deletion</button>`;
        }

        tbody.innerHTML += `
          <tr>
            <td>
              <strong>${d.name}</strong><br>
              <span style="color: var(--muted); font-size: 13px;">📞 ${d.phone}</span>
            </td>
            <td>
              <strong>${d.ambulance_type}</strong><br>
              <span style="color: var(--muted); font-size: 13px;">🚘 ${d.ambulance_number}</span>
            </td>
            <td>
              ${aadharLink}
              ${rcLink}
              ${insLink}
              ${pucLink}
            </td>
            <td>
              <span class="badge ${badgeClass}">${d.verification_status}</span>
            </td>
            <td>
              ${actionButtons}
            </td>
          </tr>
        `;
      });
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Server Error.</td></tr>';
    }
  }

  async function updateStatus(driverId, newStatus, reason = null) {
    try {
      const res = await fetch(`${BASE_URL}/api/admin/verify`, {
        method: "POST", 
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ driver_id: driverId, status: newStatus, reason: reason })
      });
      
      const data = await res.json();
      if (data.success) {
          loadDrivers(); 
      } else { 
          alert("Failed to update status."); 
      }
    } catch (err) { 
        alert("Server error."); 
    }
  }

  // Custom Prompt for Rejections
  function rejectDriver(driverId, driverName) {
      const reason = prompt(`Why are you rejecting ${driverName}? (e.g., 'Aadhar card is blurry')`);
      if (reason) {
          updateStatus(driverId, 'REJECTED', reason);
      }
  }

  // Handle Safe Account Deletion
  async function approveDeletion(driverId, driverName) {
      if(!confirm(`Are you sure you want to permanently delete ${driverName}'s account? Their billing history will be saved.`)) return;
      
      try {
          const res = await fetch(`${BASE_URL}/api/admin/approve-delete`, {
              method: "POST", 
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ driver_id: driverId })
          });
          const data = await res.json();
          
          if (data.success) {
              loadDrivers(); 
          } else {
              alert("Failed to delete account.");
          }
      } catch(err) { 
          alert("Server error."); 
      }
  }
</script>

</body>
</html>
