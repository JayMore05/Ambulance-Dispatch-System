<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15803d"><title>Trip Receipt | FastRescue"><style>
:root{--green:#15803d;--ink:#172033;--muted:#64748b;--line:#e2e8f0}*{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{margin:0;background:#f1f5f9;color:var(--ink)}header{background:#fff;padding:18px 20px;border-bottom:1px solid var(--line)}.brand{font-size:21px;font-weight:900;color:var(--green)}main{max-width:600px;margin:24px auto;padding:0 14px}.receipt{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 12px 32px #0f172a0b}.success{text-align:center;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:16px;padding:20px}.check{font-size:38px}.muted{color:var(--muted);font-size:13px}.row{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px dashed #cbd5e1}.row span:first-child{color:var(--muted)}.row strong{text-align:right;overflow-wrap:anywhere}.total{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:16px;padding:18px;margin-top:20px}.amount{font-size:34px;font-weight:900;color:var(--green);text-align:right}.btn{display:flex;justify-content:center;align-items:center;width:100%;padding:14px;border-radius:12px;background:var(--green);color:white;text-decoration:none;border:0;font-weight:800;margin-top:12px;cursor:pointer}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.error{background:#fef2f2;color:#991b1b;border-radius:12px;padding:14px}@media print{body{background:white}header,.actions{display:none}main{margin:0;max-width:none;padding:0}.receipt{box-shadow:none;border:0}}
</style></head><body><header><div class="brand">🚑 FastRescue</div></header><main><article class="receipt"><section class="success"><div class="check">✅</div><h1 style="margin:6px 0">Trip completed</h1><p style="margin:0">Thank you for using FastRescue. Here is your trip receipt.</p></section><p class="muted" style="text-align:center;margin:18px 0 4px">TRIP RECEIPT</p><div class="row"><span>Receipt / Booking ID</span><strong id="booking">—</strong></div><div class="row"><span>Driver</span><strong id="driver">—</strong></div><div class="row"><span>Ambulance</span><strong id="vehicle">—</strong></div><div class="row"><span>Emergency category</span><strong id="emergency">—</strong></div><div class="row"><span>Destination</span><strong id="destination">—</strong></div><div class="row"><span>Billed distance</span><strong id="distance">—</strong></div><div class="row"><span>Rate per km</span><strong id="rate">—</strong></div><div class="row"><span>Completed at</span><strong id="completed">—</strong></div><section class="total"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><strong>Total trip charge</strong><p class="muted" style="margin:5px 0 0">Billed distance × rate per km</p></div><div class="amount" id="amount">₹—</div></div><p class="muted" style="margin-bottom:0">This is the amount recorded by the dispatch system. Any additional fees are not included unless recorded in the booking.</p></section><div id="message" class="muted" style="margin-top:14px" role="status">Loading receipt…</div><div class="actions"><button class="btn" onclick="window.print()">🖨️ Print / Save receipt as PDF</button><a class="btn secondary" href="index.html">Return to FastRescue</a></div></article></main><script>
const API='https://ambulance-dispatch-system.onrender.com';const qs=new URLSearchParams(location.search);const id=qs.get('booking_id')||(()=>{try{return JSON.parse(localStorage.getItem('patient_session')||'{}').bookingId}catch{return null}})();const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});async function loadReceipt(){if(!id){document.getElementById('message').innerHTML='<div class="error">Booking ID missing. Open this page using the trip receipt link.</div>';return}try{const r=await fetch(`${API}/api/user/eta?booking_id=${encodeURIComponent(id)}&t=${Date.now()}`,{cache:'no-store'});const d=await r.json();if(!r.ok||d.success===false)throw Error(d.error||'Unable to load receipt');if(d.status!=='COMPLETED'){document.getElementById('message').textContent='Your trip is not marked completed yet. This receipt will update automatically.';setTimeout(loadReceipt,3000);return}document.getElementById('booking').textContent=d.booking_id;document.getElementById('driver').textContent=d.driver_name||'—';document.getElementById('vehicle').textContent=[d.driver_ambulance_type||d.ambulance_type,d.ambulance_number].filter(Boolean).join(' • ')||'—';document.getElementById('emergency').textContent=d.emergency_category||'—';document.getElementById('destination').textContent=d.hospital_name||'—';document.getElementById('distance').textContent=Number(d.billed_distance??d.distance??0).toLocaleString('en-IN')+' km';document.getElementById('rate').textContent=money(d.price_per_km)+' / km';document.getElementById('completed').textContent=d.completed_at?new Date(d.completed_at).toLocaleString():'Recorded by FastRescue';document.getElementById('amount').textContent=money(d.final_cost);document.getElementById('message').textContent='Receipt loaded successfully.';try{const s=JSON.parse(localStorage.getItem('patient_session')||'{}');s.lastCompletedAt=Date.now();localStorage.setItem('patient_session',JSON.stringify(s))}catch{}}catch(e){document.getElementById('message').innerHTML='<div class="error">'+String(e.message).replace(/[<>]/g,'')+'</div>';setTimeout(loadReceipt,5000)}}loadReceipt();
</script></body></html>
