<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#dc2626"><title>Ambulance Tracking | FastRescue">
<style>
:root{--red:#dc2626;--ink:#172033;--muted:#64748b;--line:#e2e8f0;--green:#15803d}*{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{margin:0;background:#f1f5f9;color:var(--ink)}header{background:#fff;padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}.brand{font-size:21px;font-weight:900;color:var(--red)}.pill{background:#dcfce7;color:#166534;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800}.wrap{max-width:650px;margin:0 auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #0f172a0a}.hero{background:linear-gradient(135deg,#991b1b,#ef4444);color:#fff;border:0}.hero h1{font-size:25px;margin:8px 0}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{background:#f8fafc;border:1px solid var(--line);padding:14px;border-radius:14px}.metric strong{display:block;font-size:24px;margin-top:6px}.row{padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.label{font-size:12px;color:var(--muted);margin-bottom:5px}.value{font-weight:750;overflow-wrap:anywhere}a.btn,button.btn{display:inline-flex;justify-content:center;align-items:center;width:100%;padding:14px;border:0;border-radius:12px;background:var(--red);color:#fff;text-decoration:none;font-weight:800;font-size:15px;cursor:pointer;margin-top:9px}.secondary{background:#fff!important;color:var(--ink)!important;border:1px solid var(--line)!important}.error{color:#b91c1c;background:#fef2f2;padding:12px;border-radius:12px}.statusline{display:flex;gap:10px;align-items:center}.dot{width:11px;height:11px;background:#22c55e;border-radius:50%;box-shadow:0 0 0 5px #dcfce7}@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:12px}.card{padding:16px}}
</style></head><body><header><div class="brand">🚑 FastRescue</div><span class="pill" id="statusPill">DRIVER ASSIGNED</span></header><main class="wrap"><section class="card hero"><div>YOUR AMBULANCE REQUEST</div><h1 id="headline">Your driver has been assigned</h1><p id="subhead">The ambulance is preparing to reach your pickup location.</p><div class="statusline"><span class="dot"></span><span id="liveStatus">Live status updates enabled</span></div></section>
<section class="card"><h2 style="margin-top:0">Driver & ambulance</h2><div class="row"><div class="label">Driver name</div><div class="value" id="driverName">Loading…</div></div><div class="row"><div class="label">Ambulance type / vehicle number</div><div class="value" id="vehicle">Updating…</div></div><div class="row"><div class="label">Driver contact</div><div class="value" id="phone">Not provided</div></div><a class="btn" id="callDriver" href="#" style="display:none">📞 Call your driver</a></section>
<section class="grid"><div class="card metric"><span class="muted">Estimated arrival</span><strong id="eta">Calculating…</strong><span class="muted">minutes</span></div><div class="card metric"><span class="muted">Driver distance</span><strong id="distance">—</strong><span class="muted">kilometres away</span></div></section>
<section class="card"><h2 style="margin-top:0">Trip details</h2><div class="row"><div class="label">Booking ID</div><div class="value" id="bookingId">—</div></div><div class="row"><div class="label">Destination hospital</div><div class="value" id="destination">Loading…</div></div><div class="row"><div class="label">Emergency</div><div class="value" id="emergency">—</div></div></section>
<div id="message" class="muted" role="status">Connecting to live booking status…</div><button class="btn secondary" onclick="refreshStatus()">↻ Refresh status</button><a class="btn secondary" href="tel:112">Call emergency number 112</a></main>
<script>
const API='https://ambulance-dispatch-system.onrender.com';const qs=new URLSearchParams(location.search);const id=qs.get('booking_id')||(()=>{try{return JSON.parse(localStorage.getItem('patient_session')||'{}').bookingId}catch{return null}})();let busy=false;document.getElementById('bookingId').textContent=id||'Not found';
function showError(m){document.getElementById('message').innerHTML='<div class="error">'+String(m).replace(/[<>]/g,'')+'</div>'}
async function refreshStatus(){if(!id){showError('This tracking page needs a booking ID. Open it from your patient booking screen after a driver accepts, or return to FastRescue and create a booking.');return}if(busy)return;busy=true;try{const r=await fetch(`${API}/api/user/eta?booking_id=${encodeURIComponent(id)}&t=${Date.now()}`,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});const d=await r.json();if(!r.ok||d.success===false)throw Error(d.error||'Could not load booking status');if(d.status==='COMPLETED'){location.replace(`/receipt.html?booking_id=${encodeURIComponent(id)}`);return}if(d.status==='CANCELLED'){document.getElementById('statusPill').textContent='CANCELLED';document.getElementById('headline').textContent='This request was cancelled';document.getElementById('subhead').textContent='Please return to FastRescue to make another request, or call 112 for an emergency.';document.getElementById('message').textContent='Booking cancelled.';return}document.getElementById('statusPill').textContent=d.status==='IN_TRANSIT'?'IN TRANSIT':'DRIVER ASSIGNED';document.getElementById('headline').textContent=d.status==='IN_TRANSIT'?'You are on the way to the hospital':'Your ambulance is on the way';document.getElementById('subhead').textContent=d.status==='IN_TRANSIT'?'The trip is in progress. Your trip receipt will appear when the driver completes the trip.':'Your driver accepted the request and is coming to your pickup location.';document.getElementById('liveStatus').textContent=d.status==='IN_TRANSIT'?'Trip in progress — status refreshes automatically':'Driver assigned — status refreshes automatically';document.getElementById('driverName').textContent=d.driver_name||'Driver assigned';document.getElementById('vehicle').textContent=[d.driver_ambulance_type||d.ambulance_type,d.ambulance_number].filter(Boolean).join(' • ')||'Ambulance details updating';document.getElementById('destination').textContent=d.hospital_name||'Destination pending';document.getElementById('emergency').textContent=d.emergency_category||'—';document.getElementById('eta').textContent=typeof d.eta==='number'?d.eta:'—';document.getElementById('distance').textContent=typeof d.distance==='string'?d.distance:(d.distance??'—');const p=document.getElementById('phone');if(d.driver_phone){p.textContent=d.driver_phone;const a=document.getElementById('callDriver');a.href='tel:'+String(d.driver_phone).replace(/[^+\d]/g,'');a.style.display='flex'}else p.textContent='Not available';document.getElementById('message').textContent='Last updated: '+new Date().toLocaleTimeString();}catch(e){showError(e.message+' — retrying automatically.')}finally{busy=false}}
refreshStatus();setInterval(refreshStatus,4000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshStatus()});
</script></body></html>
